<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARES // Sector</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070b10;--pan:#0e1620;--pan2:#121c28;--edge:#243140;
  --tx:#e7eef5;--mu:#8b9aab;--dim:#5d6d7e;
  --cy:#7ee0c0;--am:#f0b429;--rd:#ff5d4e;--bl:#7eb6ff;--vi:#b7a6ff
}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:13px/1.35 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
#app{display:grid;grid-template-rows:44px minmax(0,1fr) 188px;height:100vh;gap:6px;padding:6px}
.top{display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--pan);border:1px solid var(--edge);min-width:0;overflow:hidden}
.brand{font-weight:600;letter-spacing:.18em;font-size:13px;flex:none}
.area{color:var(--mu);letter-spacing:.12em;font-size:11px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:flex;align-items:center;gap:6px;color:var(--cy);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em}
.live i{width:7px;height:7px;border-radius:50%;background:var(--cy);box-shadow:0 0 8px var(--cy)}
.spacer{flex:1}
.clock{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--mu)}
.stat{display:flex;align-items:baseline;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;color:var(--dim)}
.stat b{color:var(--tx);font-size:14px;font-weight:500}
.stat.trap b{color:var(--rd)}
.summary{color:var(--mu);font-size:13px;white-space:nowrap}
#mid{display:grid;grid-template-columns:minmax(180px,270px) minmax(0,1fr) minmax(180px,260px);gap:6px;min-height:0}
@media (max-width:1100px){
  #mid{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);grid-template-rows:minmax(160px,.9fr) minmax(280px,1.1fr)}
  #mid>.panel:nth-child(2){grid-column:1 / -1;grid-row:1}
  #mid>.panel:nth-child(1){grid-column:1;grid-row:2}
  #mid>.panel:nth-child(3){grid-column:2;grid-row:2}
}
.panel{background:var(--pan);border:1px solid var(--edge);display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--pan2);
font-size:13px;font-weight:600;color:var(--tx);flex:none;border-bottom:1px solid var(--edge)}
.ph span{color:var(--mu);font-weight:500;font-size:12px}
.pb{padding:0;overflow:auto;min-height:0;flex:1}
.card{padding:14px 16px;border-bottom:1px solid #1a2531;cursor:pointer}
.card:hover{background:#101923}
.card.on{background:#132033;box-shadow:inset 3px 0 0 var(--cy)}
.card .place{font-weight:600;font-size:15px}
.card .sub{margin-top:2px;color:var(--mu);font-size:13px}
.mark{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rd);margin-right:8px;vertical-align:1px}
.cy{color:var(--cy)} .am{color:var(--am)} .rd{color:var(--rd)} .bl{color:var(--bl)} .mu{color:var(--mu)} .dim{color:var(--dim)}
button.act{display:block;width:100%;margin-top:16px;padding:12px 14px;border:none;border-radius:10px;
background:var(--cy);color:#062018;font-size:15px;font-weight:600;text-align:center;cursor:pointer}
button.act:hover{filter:brightness(1.05)}
button.act:disabled{opacity:.45;cursor:wait}
button.act.quiet{background:transparent;color:var(--tx);border:1px solid var(--edge);font-weight:500;margin-top:8px}
button.act.quiet:hover{background:#152232;filter:none}
.status{margin-top:4px;font-size:13px;font-weight:500}
.status.wait{color:var(--am)} .status.go{color:var(--cy)} .status.done{color:var(--dim)}
.status.big{font-size:22px;font-weight:600;line-height:1.25;margin:8px 0 0}
.hint{margin-top:10px;color:var(--mu);font-size:13px;line-height:1.4}
#mapwrap{position:relative;min-height:0;flex:1;background:#0a1016;overflow:hidden}
#tmap{position:absolute;inset:0}
.leaflet-container{background:#0a1016;font-family:"IBM Plex Sans",system-ui,sans-serif}
.leaflet-div-icon.pin{background:transparent;border:none}
.pin i{display:block;width:12px;height:12px;border-radius:50%;border:2px solid #070b10;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.pin.dest i{border-radius:1px;transform:rotate(45deg);width:10px;height:10px}
.pin.cam i{width:7px;height:7px;border-radius:1px;border-width:1px}
.pin b{position:absolute;left:16px;top:-3px;white-space:nowrap;font:600 11px/1.2 "IBM Plex Sans",sans-serif;color:#f4f7fb;text-shadow:0 1px 2px #000,0 0 6px #000}
.assets{margin:10px 0 0;font:500 11px/1.6 "IBM Plex Mono",monospace;color:#8fa3b6;
  letter-spacing:.03em;border-top:1px solid var(--edge);padding-top:9px}
#livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2f6d5a;
  margin-left:8px;vertical-align:middle;transition:background .15s,box-shadow .15s}
#livedot.beat{background:#7ee0c0;box-shadow:0 0 0 4px rgba(126,224,192,.22)}
.leaflet-div-icon.swarmsrc{background:transparent;border:none;overflow:visible}
.swarmsrc .pulse{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;
  background:#ff5d4e;box-shadow:0 0 0 0 rgba(255,93,78,.75);animation:srcpulse 1.9s ease-out infinite}
@keyframes srcpulse{
  0%{box-shadow:0 0 0 0 rgba(255,93,78,.7);transform:scale(.82)}
  70%{box-shadow:0 0 0 26px rgba(255,93,78,0);transform:scale(1)}
  100%{box-shadow:0 0 0 0 rgba(255,93,78,0);transform:scale(.82)}}
.swarmsrc b{position:absolute;left:16px;top:-14px;white-space:nowrap;
  font:700 13px/1.2 "IBM Plex Mono",monospace;letter-spacing:.07em;color:#ffd9d2;
  text-shadow:0 1px 3px #000,0 0 10px #000}
.swarmsrc i{position:absolute;left:16px;top:3px;white-space:nowrap;font-style:normal;
  font:500 10px/1.2 "IBM Plex Sans",sans-serif;color:#ffb0a4;
  text-shadow:0 1px 3px #000,0 0 8px #000}
#mapstat.hit{color:#ffd9d2;font-weight:700;animation:statflash 1.1s ease-in-out 3}
@keyframes statflash{0%,100%{opacity:1}50%{opacity:.35}}
.leaflet-control-attribution{background:rgba(7,11,16,.72)!important;color:#6d7c8c!important;font-size:9px!important}
.leaflet-control-attribution a{color:#8aa0b5!important}
.leaflet-bar a{background:#121a24!important;color:#d5dee8!important;border-color:#243140!important}
.leaflet-control-scale-line{background:rgba(7,11,16,.7);border-color:#8b9aab;color:#c5d0db;font-size:10px}
.overlay{position:absolute;z-index:500;pointer-events:none}
.layers{top:10px;left:10px;display:flex;gap:4px;pointer-events:auto}
.layers label{display:flex;align-items:center;gap:5px;padding:4px 7px;background:rgba(8,14,20,.82);border:1px solid var(--edge);
font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.08em;color:var(--mu);cursor:pointer}
.layers label.on{color:var(--tx);border-color:#3c5168}
.layers input{appearance:none;width:8px;height:8px;border:1px solid #8b9aab;background:transparent;flex:none}
.layers label.on input{background:var(--cy);border-color:var(--cy)}
.wind{top:10px;right:10px;display:flex;gap:8px;align-items:center;padding:8px 10px;background:rgba(8,14,20,.88);border:1px solid var(--edge);max-width:calc(100% - 20px)}
.dial{width:36px;height:36px;border:1px solid #3c5168;border-radius:50%;position:relative;flex:none}
.dial i{position:absolute;left:16px;top:5px;width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-bottom:14px solid var(--am);transform-origin:3px 13px}
.wind b{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;font-weight:500}
.wind span{color:var(--mu);font-size:11px}
.legend{left:10px;bottom:28px;display:flex;gap:10px;padding:4px 8px;background:rgba(8,14,20,.82);border:1px solid var(--edge);
font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.06em;color:var(--mu)}
.legend s{display:inline-block;width:8px;height:8px;margin-right:4px;text-decoration:none;vertical-align:-1px}
.hear{top:10px;left:10px;max-width:min(560px,calc(100% - 180px));padding:8px 12px;background:rgba(8,14,20,.92);border:1px solid var(--edge)}
.hear span{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.14em;color:var(--cy)}
.hear b{display:block;margin-top:3px;font-weight:500;font-size:15px;line-height:1.35}
#moment{position:absolute;z-index:650;left:16px;right:16px;bottom:52px;padding:16px 18px 18px;background:rgba(6,10,14,.94);border:1px solid #3c5168;pointer-events:none}
#moment[hidden]{display:none}
#moment span{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;color:var(--cy)}
#moment p{margin-top:8px;font-size:28px;line-height:1.2;letter-spacing:-.03em;font-weight:600}
#moment em{display:block;margin-top:8px;font-style:normal;color:var(--mu);font-size:13px}
#detail{padding:16px;display:flex;flex-direction:column}
.decision{margin-top:12px}
#detail h2{font-size:20px;font-weight:600;letter-spacing:-.02em}
#detail .problem{margin-top:4px;color:var(--mu);font-size:14px}
#detail .say{margin-top:14px;color:var(--tx);font-size:15px;line-height:1.45}
#cams{display:grid;grid-template-columns:1.35fr 1.35fr repeat(4,minmax(0,1fr));gap:6px;height:100%;padding:6px}
.cam{position:relative;background:#0a1016;border:1px solid var(--edge);padding:0;cursor:pointer;overflow:hidden;min-width:0;text-align:left}
.cam img{width:100%;height:100%;object-fit:cover;display:block;background:#0a1016}
.cam .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.82));
font-size:11px;line-height:1.25}
.cam .cap b{display:block;font-weight:600}
.cam .cap span{color:#c5d0db;font-family:"IBM Plex Mono",monospace;font-size:10px}
.cam s{position:absolute;top:6px;left:6px;background:#c62828;color:#fff;font-family:"IBM Plex Mono",monospace;font-size:9px;
letter-spacing:.08em;padding:1px 4px;text-decoration:none}
.cam:hover{border-color:#8b9aab}
.cam.badpic img{display:none}
.cam.badpic::before{content:"no picture";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px}
.empty{padding:16px;color:var(--dim);font-size:12px}
#viewer[hidden]{display:none}
#viewer{position:fixed;inset:0;z-index:2000;background:rgba(4,7,10,.82);display:flex;align-items:center;justify-content:center;padding:24px}
.vcard{width:min(1100px,92vw);background:#0e1620;border:1px solid var(--edge);display:flex;flex-direction:column;max-height:90vh}
.vcard img{width:100%;max-height:calc(90vh - 52px);object-fit:contain;background:#000}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px}
.vbar b{display:block}
.vbar span{color:var(--mu);font-size:12px}
#vclose{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;background:transparent;border:1px solid var(--edge);padding:6px 10px;cursor:pointer}
#vclose:hover{border-color:var(--tx)}
</style></head><body><div id="app">

<div class="top">
  <div class="brand">ARES</div>
  <div class="area" id="area">San Diego</div>
  <div class="spacer"></div>
  <div class="summary" id="summary">No one is waiting</div>
  <div class="clock" id="clock">--:--:--</div>
</div>

<div id="mid">
  <div class="panel">
    <div class="ph">People<span id="qcount">0</span></div>
    <div class="pb" id="queue"></div>
  </div>

  <div class="panel">
    <div class="ph">Map<span id="mapstat">Finding the area<i id="livedot"></i></span></div>
    <div id="mapwrap">
      <div id="tmap"></div>
      <div class="overlay wind" id="wind" hidden>
        <div class="dial"><i id="windarrow"></i></div>
        <div>
          <b id="windline">Smoke</b>
          <span id="windsub"></span>
        </div>
      </div>
      <div class="overlay hear" id="hear" hidden>
        <span>HEARING</span>
        <b id="hearline"></b>
      </div>
      <div id="moment" hidden>
        <span>THEY HEAR</span>
        <p id="momentline"></p>
        <em id="momentwhere"></em>
      </div>
      <div class="overlay legend">
        <span><s style="background:#f0b429;border-radius:50%"></s>Person</span>
        <span><s style="background:#7ee0c0"></s>Route</span>
        <span><s style="background:#ff5d4e"></s>Smoke</span>
        <span><s style="background:#ff5d4e;border-radius:50%;box-shadow:0 0 0 2px rgba(255,93,78,.35)"></s>Fire, located by callers</span>
        <span><s style="background:#b7a6ff"></s>Camera</span>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="ph">This person<span id="calltag"></span></div>
    <div class="pb" id="detail"></div>
  </div>
</div>

<div class="panel">
  <div class="ph">Cameras<span id="camstat"></span></div>
  <div class="pb" id="cams"></div>
</div>
</div>

<div id="viewer" hidden>
  <div class="vcard">
    <img id="vimg" class="frame" alt="">
    <div class="vbar">
      <div><b id="vname"></b><span id="vmeta"></span></div>
      <button type="button" id="vclose">Close</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="console.js"></script>
</body></html>
